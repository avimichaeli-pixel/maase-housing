<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a3a5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>מרכז מעשה — ניהול דיור</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ── TOKENS ────────────────────────────── */
:root{
  --blue:#1a3a5c; --blum:#2563ab; --blul:#dbeafe;
  --green:#16a34a; --greenl:#dcfce7;
  --orange:#ea580c; --orangel:#ffedd5;
  --red:#dc2626; --redl:#fee2e2;
  --purple:#7c3aed; --purplel:#ede9fe;
  --g50:#f8fafc; --g100:#f1f5f9; --g200:#e2e8f0;
  --g400:#94a3b8; --g600:#475569; --g800:#1e293b;
  --r:12px; --sh:0 2px 8px rgba(0,0,0,.09); --sh2:0 8px 28px rgba(0,0,0,.15);
  --f:'Segoe UI',Arial,sans-serif;
  --bnav:64px; /* bottom nav height */
}

/* ── RESET ──────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--f);background:var(--g50);color:var(--g800);direction:rtl;
     font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button{cursor:pointer;font-family:var(--f);border:none;background:none;-webkit-appearance:none}
input,select,textarea{font-family:var(--f);direction:rtl;font-size:16px;/* prevents iOS zoom */}
a{color:inherit;text-decoration:none}
img{max-width:100%}

/* ── LOGIN ──────────────────────────────── */
#login-screen{
  min-height:100svh;display:flex;align-items:center;justify-content:center;
  padding:16px;
  background:linear-gradient(150deg,#0d2540 0%,#1a3a5c 55%,#1e6bb8 100%);
}
.lcard{background:#fff;border-radius:20px;width:100%;max-width:400px;overflow:hidden;box-shadow:var(--sh2)}
.lhero{background:linear-gradient(135deg,var(--blue),var(--blum));padding:28px 24px 20px;text-align:center}
.lhero .ico{font-size:44px;display:block;margin-bottom:8px}
.lhero h1{color:#fff;font-size:20px;font-weight:800}
.lhero p{color:rgba(255,255,255,.6);font-size:13px;margin-top:3px}
.lbody{padding:22px}
.lbody form{display:flex;flex-direction:column;gap:12px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:11px;font-weight:800;color:var(--g600);text-transform:uppercase;letter-spacing:.5px}
.fc{border:1.5px solid var(--g200);border-radius:10px;padding:13px 14px;
    font-size:16px;width:100%;outline:none;background:#fff;transition:border-color .15s}
.fc:focus{border-color:var(--blum);box-shadow:0 0 0 3px rgba(37,99,171,.1)}
.btn-login{width:100%;padding:14px;background:var(--blum);color:#fff;
           border-radius:12px;font-size:16px;font-weight:800;margin-top:4px;
           transition:transform .1s,opacity .15s}
.btn-login:active{transform:scale(.97);opacity:.9}
.lfoot{border-top:1px solid var(--g100);background:var(--g50);padding:18px 22px 22px}
.lfoot p{font-size:11px;color:var(--g400);text-align:center;margin-bottom:10px;
          font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.demo-row{display:flex;gap:8px}
.dbtn{flex:1;padding:12px 4px;border-radius:10px;border:1.5px solid var(--g200);
      background:#fff;font-size:11px;font-weight:800;color:var(--g600);
      display:flex;flex-direction:column;align-items:center;gap:5px;
      transition:border-color .15s,color .15s,transform .1s}
.dbtn:active{transform:scale(.95)}
.dbtn .di{font-size:24px}
.dbtn:hover,.dbtn:active{border-color:var(--blum);color:var(--blum)}

/* ── APP SHELL (mobile-first) ───────────── */
#app{display:none;min-height:100svh;flex-direction:column}

/* sidebar: hidden drawer on mobile */
#sidebar{
  position:fixed;top:0;right:0;bottom:0;
  width:min(280px,85vw);
  background:var(--blue);color:#fff;
  display:flex;flex-direction:column;
  z-index:600;
  transform:translateX(110%);
  transition:transform .28s cubic-bezier(.4,0,.2,1);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
#sidebar.open{transform:translateX(0)}

/* main: full width on mobile */
#main{
  flex:1;display:flex;flex-direction:column;
  min-height:100svh;
  padding-bottom:var(--bnav); /* space for bottom nav */
}

/* topbar */
#topbar{
  position:sticky;top:0;z-index:100;
  background:#fff;border-bottom:1px solid var(--g200);
  height:54px;padding:0 14px;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 1px 4px rgba(0,0,0,.06);flex-shrink:0;
}
.ptitle{font-size:16px;font-weight:800;color:var(--blue);flex:1;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menu-btn{font-size:26px;color:var(--g600);padding:4px;flex-shrink:0;line-height:1}

/* content */
#content{flex:1;padding:14px;display:flex;flex-direction:column;gap:14px}

/* bottom nav */
#bnav{
  position:fixed;bottom:0;left:0;right:0;
  height:var(--bnav);background:#fff;
  border-top:1px solid var(--g200);
  display:flex;z-index:500;
  box-shadow:0 -2px 12px rgba(0,0,0,.08);
}
.bn{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;
  font-size:10px;font-weight:700;color:var(--g400);
  cursor:pointer;position:relative;
  padding:6px 2px 8px;
  transition:color .15s;
  -webkit-tap-highlight-color:transparent;
}
.bn.on{color:var(--blum)}
.bn .bi{font-size:22px;line-height:1;transition:transform .15s}
.bn.on .bi{transform:scale(1.1)}
.bndot{position:absolute;top:6px;right:calc(50% - 14px);
       width:8px;height:8px;background:var(--red);
       border-radius:50%;border:2px solid #fff}

/* FAB */
#fab{
  position:fixed;bottom:calc(var(--bnav) + 12px);left:16px;
  width:54px;height:54px;border-radius:50%;
  background:var(--red);color:#fff;
  font-size:30px;line-height:1;font-weight:300;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 18px rgba(220,38,38,.4);
  z-index:400;transition:transform .15s,box-shadow .15s;
}
#fab:active{transform:scale(.92)}

/* overlay */
#ovl{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);
     z-index:595;backdrop-filter:blur(2px)}
#ovl.on{display:block}

/* ── SIDEBAR internals ──────────────────── */
.sbl{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
.sbl h1{font-size:16px;font-weight:800;color:#fff}
.sbl p{font-size:11px;color:rgba(255,255,255,.5);margin-top:2px}
.sbu{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.12);
     display:flex;align-items:center;gap:10px}
.sbav{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);
      display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.sbun{font-size:13px;font-weight:700;color:#fff}
.sbur{font-size:11px;color:rgba(255,255,255,.5)}
.sbnav{flex:1;padding:6px 0}
.ni{display:flex;align-items:center;gap:11px;
    padding:13px 16px;font-size:14px;font-weight:600;
    color:rgba(255,255,255,.72);cursor:pointer;
    border-right:3px solid transparent;transition:background .15s,color .15s}
.ni:active,.ni:hover{background:rgba(255,255,255,.1);color:#fff}
.ni.on{background:rgba(255,255,255,.14);color:#fff;border-right-color:#60a5fa;font-weight:800}
.nib{font-size:18px;width:22px;text-align:center;flex-shrink:0}
.nbadge{background:var(--red);color:#fff;font-size:10px;font-weight:800;
        border-radius:10px;padding:1px 6px;margin-right:auto}
.sbf{padding:12px 16px;border-top:1px solid rgba(255,255,255,.12)}
.btn-out{width:100%;padding:10px;background:rgba(255,255,255,.1);
         color:rgba(255,255,255,.7);border-radius:8px;font-size:13px;font-weight:700;
         transition:background .15s}
.btn-out:active{background:rgba(255,255,255,.2)}

/* ── COMPONENTS ─────────────────────────── */
/* cards */
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.cardsm{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px}

/* stat cards — 2-col on mobile */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc{background:#fff;border-radius:var(--r);padding:14px;box-shadow:var(--sh);
    border-right:4px solid;display:flex;flex-direction:column;gap:2px}
.snum{font-size:28px;font-weight:900;line-height:1}
.slbl{font-size:11px;color:var(--g600);line-height:1.4}
.sc.sb{border-color:var(--blum)}.sc.sb .snum{color:var(--blum)}
.sc.sr{border-color:var(--red)}.sc.sr .snum{color:var(--red)}
.sc.so{border-color:var(--orange)}.sc.so .snum{color:var(--orange)}
.sc.sg{border-color:var(--green)}.sc.sg .snum{color:var(--green)}
.sc.sp{border-color:var(--purple)}.sc.sp .snum{color:var(--purple)}

/* badges */
.bx{display:inline-flex;align-items:center;font-size:11px;font-weight:700;
    padding:3px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.xg{background:var(--greenl);color:var(--green)}
.xo{background:var(--orangel);color:var(--orange)}
.xr{background:var(--redl);color:var(--red)}
.xb{background:var(--blul);color:var(--blum)}
.xp{background:var(--purplel);color:var(--purple)}
.xgr{background:var(--g100);color:var(--g600)}

/* chips */
.cx{display:inline-block;background:var(--g100);color:var(--g600);
    border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;flex-shrink:0}
.cxb{background:var(--blul);color:var(--blum)}
.cxr{background:var(--redl);color:var(--red)}
.cxo{background:var(--orangel);color:var(--orange)}
.cxp{background:var(--purplel);color:var(--purple)}
.cxg{background:var(--greenl);color:var(--green)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
     padding:11px 18px;border-radius:10px;font-size:14px;font-weight:700;
     white-space:nowrap;cursor:pointer;
     transition:transform .1s,opacity .15s;-webkit-appearance:none}
.btn:active{transform:scale(.95)}
.btnp{background:var(--blum);color:#fff}
.btns{background:var(--green);color:#fff}
.btnd{background:var(--red);color:#fff}
.btno{background:transparent;border:1.5px solid var(--g200);color:var(--g600)}
.btno:active,.btno:hover{border-color:var(--blum);color:var(--blum)}
.btnsm{padding:8px 13px;font-size:12px;border-radius:8px}

/* section title */
.stitle{font-size:14px;font-weight:800;color:var(--blue);margin-bottom:12px;
        display:flex;align-items:center;gap:7px}

/* tabs */
.tabs{display:flex;border-bottom:2px solid var(--g200);
      overflow-x:auto;-webkit-overflow-scrolling:touch;
      scrollbar-width:none;margin-bottom:14px;flex-shrink:0}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 14px;font-size:13px;font-weight:700;color:var(--g400);
     cursor:pointer;border-bottom:2px solid transparent;
     margin-bottom:-2px;white-space:nowrap;transition:color .15s;flex-shrink:0}
.tab.on{color:var(--blum);border-bottom-color:var(--blum)}

/* alerts */
.al{border-radius:10px;padding:11px 13px;display:flex;align-items:flex-start;
    gap:8px;font-size:13px}
.alr{background:var(--redl);color:#991b1b;border-right:3px solid var(--red)}
.alo{background:var(--orangel);color:#9a3412;border-right:3px solid var(--orange)}
.alb{background:var(--blul);color:#1e40af;border-right:3px solid var(--blum)}
.alg{background:var(--greenl);color:#14532d;border-right:3px solid var(--green)}

/* form group — always single column on mobile */
.fgrid{display:flex;flex-direction:column;gap:12px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:11px;font-weight:800;color:var(--g600);
          text-transform:uppercase;letter-spacing:.4px}
.fc{border:1.5px solid var(--g200);border-radius:10px;
    padding:12px 13px;font-size:16px;outline:none;width:100%;
    background:#fff;transition:border-color .15s}
.fc:focus{border-color:var(--blum);box-shadow:0 0 0 3px rgba(37,99,171,.1)}
textarea.fc{resize:vertical;min-height:80px;font-size:15px}

/* upload */
.upload{border:2px dashed var(--g200);border-radius:10px;padding:20px 16px;
        text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.upload:active{border-color:var(--blum);background:var(--blul)}
.upload p{font-size:13px;color:var(--g600)}
.upload .ui{font-size:28px;margin-bottom:6px}

/* progress */
.prog{background:var(--g200);border-radius:10px;height:8px;overflow:hidden}
.progf{height:100%;border-radius:10px;transition:width .4s}

/* timeline */
.tl{position:relative;padding-right:22px}
.tl::before{content:'';position:absolute;right:7px;top:4px;bottom:0;width:2px;background:var(--g200)}
.tli{position:relative;padding-bottom:16px;padding-right:20px}
.tld{position:absolute;right:-1px;top:4px;width:10px;height:10px;
     border-radius:50%;border:2px solid #fff}
.tdg{background:var(--green)}.tdr{background:var(--red)}
.tdo{background:var(--orange)}.tdb{background:var(--blum)}
.tldt{font-size:10px;color:var(--g400)}
.tlt{font-size:12px;color:var(--g600);margin-top:1px}

/* notif items */
.nitem{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--g100);cursor:pointer}
.nitem:last-child{border-bottom:none}
.nico{width:40px;height:40px;border-radius:50%;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;font-size:18px}
.nbody{flex:1;min-width:0}
.ntit{font-size:13px;font-weight:700;line-height:1.3}
.nmeta{font-size:11px;color:var(--g400);margin-top:2px}
.nact{font-size:12px;color:var(--blum);font-weight:700;margin-top:4px}

/* fault/apt cards (mobile-optimised) */
.fcard{background:#fff;border-radius:var(--r);box-shadow:var(--sh);
       padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer}
.fcard:active{background:var(--g50)}
.frow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ftit{font-size:14px;font-weight:800;color:var(--blue)}
.fsub{font-size:12px;color:var(--g600);margin-top:2px}
.fdesc{font-size:13px;color:var(--g800);line-height:1.4}
.ftags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* apt card */
.acard{background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.acard-hdr{padding:14px 16px 10px;border-bottom:1px solid var(--g100);
           display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.aname{font-size:14px;font-weight:800;color:var(--blue);line-height:1.3}
.asub{font-size:12px;color:var(--g600);margin-top:2px}
.acard-body{padding:10px 16px}
.ameta{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--g600)}
.ameta span{display:flex;align-items:center;gap:6px}
.achips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acard-foot{
  padding:12px 16px;border-top:1px solid var(--g100);
  display:flex;gap:8px;background:var(--g50);
}
.acard-foot .btn{flex:1;padding:11px 6px;font-size:13px}

/* insp card */
.icard{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px}
.icard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.icard-tit{font-weight:800;font-size:14px;color:var(--blue)}
.icard-sub{font-size:11px;color:var(--g400);margin-top:2px}
.icard-bot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* checklist */
.cli{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--g100)}
.cli:last-child{border-bottom:none}
.clilbl{font-size:14px;font-weight:600}
.clibtn{display:flex;gap:6px;margin-top:2px}
.csb{padding:8px 14px;border-radius:8px;font-size:12px;font-weight:700;
     border:1.5px solid;background:transparent;cursor:pointer;transition:all .12s;flex:1;
     -webkit-tap-highlight-color:transparent}
.csbg{border-color:var(--green);color:var(--green)}.csbg.on{background:var(--green);color:#fff}
.csbr{border-color:var(--red);color:var(--red)}.csbr.on{background:var(--red);color:#fff}
.csbn{border-color:var(--g400);color:var(--g400)}.csbn.on{background:var(--g400);color:#fff}

/* bar chart */
.bchart{display:flex;align-items:flex-end;gap:6px;height:100px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.bbar{width:100%;border-radius:5px 5px 0 0;min-height:4px;transition:height .5s}
.blbl{font-size:10px;color:var(--g400)}
.bval{font-size:10px;font-weight:800;color:var(--g600)}

/* modal — bottom sheet on mobile */
.movl{position:fixed;inset:0;background:rgba(0,0,0,.5);
      z-index:1000;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-height:94svh;
       border-radius:20px 20px 0 0;
       overflow-y:auto;-webkit-overflow-scrolling:touch}
.mhdr{padding:16px 18px 12px;border-bottom:1px solid var(--g200);
      display:flex;align-items:center;justify-content:space-between;
      position:sticky;top:0;background:#fff;z-index:1}
.mhdr::before{content:'';display:block;width:36px;height:4px;
              background:var(--g200);border-radius:2px;
              position:absolute;top:8px;left:50%;transform:translateX(-50%)}
.mhdr h2{font-size:15px;font-weight:800;color:var(--blue)}
.mclose{width:30px;height:30px;border-radius:50%;background:var(--g100);
        display:flex;align-items:center;justify-content:center;
        font-size:18px;color:var(--g600);cursor:pointer;flex-shrink:0}
.mbody{padding:16px 18px;display:flex;flex-direction:column;gap:13px}
.mfoot{padding:14px 18px;border-top:1px solid var(--g200);
       display:flex;flex-direction:column;gap:9px;
       position:sticky;bottom:0;background:#fff;z-index:1}
.mfoot .btn{width:100%;padding:14px}

/* filter row */
.frow-bar{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;
          scrollbar-width:none;padding-bottom:2px;flex-shrink:0}
.frow-bar::-webkit-scrollbar{display:none}
.frow-bar .fc{width:auto;white-space:nowrap;flex-shrink:0;padding:9px 12px;font-size:13px}

/* toast */
.toast{position:fixed;bottom:calc(var(--bnav) + 12px);left:50%;
       transform:translateX(-50%);
       background:var(--blue);color:#fff;
       padding:12px 20px;border-radius:12px;
       font-size:14px;font-weight:700;z-index:9999;
       box-shadow:var(--sh2);white-space:nowrap;
       animation:tin .2s ease}
@keyframes tin{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}

/* empty state */
.empty{text-align:center;padding:40px 16px;color:var(--g400)}
.empty .ei{font-size:44px;margin-bottom:10px;opacity:.4}
.empty p{font-size:14px}

/* divider */
.div{border:none;border-top:1px solid var(--g200);margin:4px 0}

/* ── DESKTOP overrides (min 769px) ─────── */
@media(min-width:769px){
  #app{flex-direction:row}

  /* sidebar always visible */
  #sidebar{
    position:relative;transform:none!important;
    width:252px;flex-shrink:0;height:100svh;
    overflow-y:auto;
  }

  #main{padding-bottom:0;height:100svh;overflow:hidden}

  #topbar{padding:0 24px}
  .topbar-search{display:flex!important}
  .topbar-filters{display:flex!important}

  #content{padding:22px;overflow-y:auto;flex:1}

  #bnav{display:none!important}
  #fab{display:none!important}
  #menu-btn{display:none!important}
  #ovl{display:none!important}

  /* 2-col form grid on desktop */
  .fgrid.d2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  /* 2-col layout blocks */
  .d2col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .d4col{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .d3col{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

  /* apt grid */
  .aptgrid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))!important}

  /* stat grid: 4 cols */
  .stats{grid-template-columns:repeat(4,1fr)!important}

  /* modal: centered dialog */
  .movl{align-items:center;padding:20px}
  .modal{border-radius:16px;max-width:580px;max-height:90svh}
  .mhdr::before{display:none}
  .mfoot{flex-direction:row}

/* ── SUPABASE ─────────────────────────── */
const SUPA_URL = 'https://nfefaqzjfwgvvtqwydph.supabase.co';
const SUPA_KEY = 'sb_publishable_PV3q8XaD87a8I7BFUK0Mww_PM-fjFXd';
let sb = null;
let DB_READY = false;

async function initSupabase() {
  try {
    sb = supabase.createClient(SUPA_URL, SUPA_KEY);
    // Test connection
    const { data, error } = await sb.from('users').select('count', {count:'exact',head:true});
    if (error && error.code === '42P01') {
      // Tables don't exist yet
      console.log('Tables not created yet');
      DB_READY = false;
    } else {
      DB_READY = true;
      console.log('✅ Supabase connected');
      await loadUsersFromDB();
      await loadApartmentsFromDB();
    }
  } catch(e) {
    console.warn('Supabase offline, using local data:', e.message);
    DB_READY = false;
  }
}

// ── LOAD DATA ──
async function loadUsersFromDB() {
  if (!DB_READY) return;
  const { data, error } = await sb.from('users').select('*').order('added_at');
  if (!error && data && data.length > 0) {
    // Merge with local USERS, DB takes priority
    data.forEach(u => {
      const exists = USERS.findIndex(x => x.phone === u.phone);
      const mapped = {
        id: u.id, name: u.name, phone: u.phone,
        role: u.role, rh: {superadmin:'מנהל ראשי',admin:'מנהל ארגון',housing:'מנהל דיור',manager:'מנהל דירה'}[u.role] || u.role,
        title: u.title || u.role, active: u.active,
        zone: u.zone || '', addedBy: u.added_by || '', addedAt: u.added_at ? u.added_at.split('T')[0] : ''
      };
      if (exists >= 0) USERS[exists] = mapped;
      else USERS.push(mapped);
    });
    console.log('✅ Users loaded from DB:', data.length);
  }
}

async function loadApartmentsFromDB() {
  if (!DB_READY) return;
  const { data, error } = await sb.from('apartments').select('*').order('proj');
  if (!error && data && data.length > 0) {
    // Replace APTS with DB data
    APTS.length = 0;
    data.forEach(a => {
      APTS.push({
        id: a.id, proj: a.proj || '', city: a.city || '',
        addr: a.addr || '', type: a.type || '',
        lease: a.lease || '', ll: a.landlord || '',
        ph: a.phone || '', elec: a.elec || '', water: a.water || '',
        mg: a.manager_name || '', hm: a.housing_manager || '',
        st: a.status || 'פעילה', faults: 0, ins: false,
        sheet: a.sheet || 'תשפו', notes: a.notes || ''
      });
    });
    console.log('✅ Apartments loaded from DB:', data.length);
  }
}

async function loadFaultsFromDB() {
  if (!DB_READY) return [];
  const { data, error } = await sb.from('faults').select('*').order('reported_at', {ascending:false});
  if (!error && data) {
    FAULTS.length = 0;
    data.forEach(f => {
      FAULTS.push({
        id: f.id, aid: f.apt_id, apt: f.apt_addr, city: f.city,
        pr: f.proj, rep: f.reporter,
        date: f.reported_at ? new Date(f.reported_at).toLocaleDateString('he-IL') : '',
        cat: f.category, desc: f.description,
        urg: f.urgency, rec: f.recurring, rn: f.recurrence_count,
        st: f.status, hn: f.handler, note: f.handler_note
      });
    });
    return data;
  }
  return [];
}

// ── SAVE DATA ──
async function saveFaultToDB(fault) {
  if (!DB_READY) return;
  const { error } = await sb.from('faults').insert({
    id: fault.id.startsWith('f') ? undefined : fault.id,
    apt_id: fault.aid, apt_addr: fault.apt,
    city: fault.city, proj: fault.pr,
    reporter: fault.rep, category: fault.cat,
    description: fault.desc, urgency: fault.urg,
    recurring: fault.rec, recurrence_count: fault.rn || 0,
    status: fault.st
  });
  if (error) console.error('Save fault error:', error);
  else console.log('✅ Fault saved to DB');
}

async function updateFaultInDB(faultId, updates) {
  if (!DB_READY) return;
  const { error } = await sb.from('faults').update({
    status: updates.st, handler: updates.hn,
    handler_note: updates.note, updated_at: new Date().toISOString(),
    closed_at: updates.st === 'תוקנה' ? new Date().toISOString() : null,
    closed_by: updates.st === 'תוקנה' ? CU.name : null
  }).eq('id', faultId);
  if (error) console.error('Update fault error:', error);
}

async function saveInspectionToDB(insp) {
  if (!DB_READY) return;
  const { error } = await sb.from('inspections').insert({
    apt_id: insp.aid, apt_addr: insp.apt,
    city: insp.city, type: insp.type,
    month: insp.month, year: insp.year,
    inspector: insp.inspector, status: insp.status,
    score: insp.score || 0, notes: insp.notes || ''
  });
  if (error) console.error('Save inspection error:', error);
  else console.log('✅ Inspection saved to DB');
}

async function saveUserToDB(user) {
  if (!DB_READY) return;
  const { error } = await sb.from('users').upsert({
    id: user.id, name: user.name, phone: user.phone,
    role: user.role, title: user.title,
    zone: user.zone, active: user.active,
    added_by: user.addedBy
  });
  if (error) console.error('Save user error:', error);
  else console.log('✅ User saved to DB');
}

async function saveAuditLog(action, details, aptId, aptAddr) {
  if (!DB_READY) return;
  await sb.from('audit_log').insert({
    action, user_name: CU?.name, user_phone: CU?.phone,
    apt_id: aptId, apt_addr: aptAddr, details
  });
}

async function seedInitialData() {
  if (!DB_READY) return;
  // Seed users
  for (const u of USERS) {
    await saveUserToDB(u);
  }
  // Seed apartments
  const aptsToSeed = APTS.map(a => ({
    id: a.id, proj: a.proj, city: a.city, addr: a.addr,
    type: a.type, lease: a.lease, landlord: a.ll,
    phone: a.ph, elec: a.elec, water: a.water,
    manager_name: a.mg, housing_manager: a.hm,
    status: a.st, sheet: a.sheet
  }));
  const { error } = await sb.from('apartments').upsert(aptsToSeed);
  if (error) console.error('Seed apartments error:', error);
  else console.log('✅ Seeded', aptsToSeed.length, 'apartments');
}

function normalizePhone(p){
  // strip spaces, dashes, +972 prefix → 05X format
  p=p.replace(/[\s\-]/g,'');
  if(p.startsWith('+972'))p='0'+p.slice(4);
  if(p.startsWith('972'))p='0'+p.slice(3);
  return p;
}

function doLoginBtn(){
  const raw=document.getElementById('li-phone').value.trim();
  const phone=normalizePhone(raw);
  const user=USERS.find(u=>normalizePhone(u.phone)===phone);
  const errEl=document.getElementById('login-err');
  if(!raw){
    errEl.style.display='flex';
    document.getElementById('login-err-msg').textContent='יש להזין מספר טלפון';
    return;
  }
  if(!user){
    errEl.style.display='flex';
    document.getElementById('login-err-msg').textContent='מספר טלפון לא מזוהה במערכת';
    document.getElementById('li-phone').focus();
    return;
  }
  if(!user.active){
    errEl.style.display='flex';
    document.getElementById('login-err-msg').textContent='משתמש זה אינו פעיל';
    return;
  }
  errEl.style.display='none';
  loginAs(user);
}
function doLogin(e){
  e.preventDefault();
  const raw=document.getElementById('li-phone').value.trim();
  const phone=normalizePhone(raw);
  const user=USERS.find(u=>normalizePhone(u.phone)===phone);
  const errEl=document.getElementById('login-err');
  if(!user){
    errEl.style.display='flex';
    document.getElementById('login-err-msg').textContent='מספר טלפון לא מזוהה במערכת';
    document.getElementById('li-phone').focus();
    return;
  }
  if(!user.active){
    errEl.style.display='flex';
    document.getElementById('login-err-msg').textContent='משתמש זה אינו פעיל — פנה למנהל המערכת';
    return;
  }
  errEl.style.display='none';
  loginAs(user);
}

function qlPhone(phone){
  document.getElementById('li-phone').value=phone;

}

async function loginAs(user){
  CU=user;
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('sbav').textContent=RI[CU.role];
  document.getElementById('sbun').textContent=CU.name;
  document.getElementById('sbur').textContent=CU.title||RL[CU.role];
  const isAdm=CU.role==='superadmin'||CU.role==='admin';
  document.querySelectorAll('.admin-only').forEach(e=>
    e.style.display=isAdm?'flex':'none');
  // Load faults from DB
  if(DB_READY) await loadFaultsFromDB();
  go('dashboard');
}

function subFault(){

  if(!name){toast('שם מלא הוא שדה חובה!','var(--red)');return}

function setCS(i,v,btn){
  btn.closest('.clibtn').querySelectorAll('.csb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  const row=document.getElementById('cl-'+i);
  const ex=row.querySelector('.cl-fault-btn');
  if(v==='bad'&&!ex){
    const b=document.createElement('button');
    b.className='btn btnd btnsm cl-fault-btn';
    b.style.marginTop='8px';b.textContent='⚠ פתח תקלה';
    b.onclick=()=>{cm();om('fault')};
    row.appendChild(b);
  }else if(v!=='bad'&&ex)ex.remove();
}

  sm(`<div class="modal">

        <input class="fc" id="nu-phone" type="tel" placeholder="05X-XXXXXXX" inputmode="tel">
      </div>

        <span id="role-hint-txt">מנהל דיור יכול לראות את כל הדירות שהוגדרו לו, לעדכן תקלות ולבצע ביקורות דיור.</span>
      </div>
      <div class="fg"><label>אזור / דירות משויכות</label>
        <input class="fc" id="nu-zone" placeholder="לדוגמה: חיפה, עכו">
      </div>
      <div class="div"></div>
      <div class="al alo" style="font-size:12px">
        <span>⚠️</span>
        <div>
          <b>שימו לב:</b> הכניסה למערכת תהיה <b>לפי מספר הטלפון בלבד</b>.<br>
          וודאו שהמספר נכון לפני השמירה.
        </div>
      </div>
      <div class="fg"><label>שם המוסיף (חובה) *</label>
        <input class="fc" id="nu-added" value="${CU.name}" readonly style="background:var(--g50);color:var(--g600)">
      </div>
    </div>
    <div class="mfoot">
      <button class="btn btnp" onclick="submitAddUser()">💾 הוסף משתמש</button>
      <button class="btn btno" onclick="cm()">ביטול</button>
    </div>
  </div>`);
}

function updateRoleHint(role){
  const hints={
    superadmin:'מנהל ראשי — גישה מלאה לכל המערכת, כולל ניהול הרשאות ומשתמשים.',
    housing:'מנהל דיור יכול לראות את כל הדירות שהוגדרו לו, לעדכן תקלות ולבצע ביקורות דיור.',
    manager:'מנהל דירה יכול לדווח תקלות ולבצע ביקורת דירה בדירות המשויכות אליו בלבד.',
  };
  const el=document.getElementById('role-hint-txt');
  if(el)el.textContent=hints[role]||'';
}

function submitAddUser(){
  const name=document.getElementById('nu-name').value.trim();
  const phone=document.getElementById('nu-phone').value.trim();
  const role=document.getElementById('nu-role').value;
  const title=document.getElementById('nu-title').value.trim();
  const zone=document.getElementById('nu-zone').value.trim();
  if(!name){toast('שם מלא חובה','var(--red)');return}
  if(!phone){toast('מספר טלפון חובה','var(--red)');return}
  const norm=phone.replace(/[\s\-]/g,'');
  if(USERS.find(u=>u.phone.replace(/[\s\-]/g,'')===norm)){
    toast('מספר טלפון זה כבר קיים במערכת!','var(--red)');return
  }
  const rh={superadmin:'מנהל ראשי',housing:'מנהל דיור',manager:'מנהל דירה'}[role];
  const newUser={
    id:'u'+(USERS.length+1),name,phone:norm,
    role,rh,title:title||rh,active:true,zone,
    addedBy:CU.name,addedAt:new Date().toLocaleDateString('he-IL')
  };
  USERS.push(newUser);
  LOG.unshift({ts:new Date().toLocaleString('he-IL'),user:CU.name,act:'הוספת משתמש',apt:'—',ch:`נוסף: ${name} (${rh})`});
  saveUserToDB(newUser);
  saveAuditLog('הוספת משתמש', `נוסף: ${name} (${rh})`, null, null);
  cm();go('users');
  toast(`${name} נוסף בהצלחה ✓`,'var(--green)');
}

/* ── Edit User ── */
function mUserEdit(uid){
  const u=USERS.find(x=>x.id===uid);
  if(!u)return;
  // only superadmin can edit other superadmins
  if(u.role==='superadmin'&&!isSuperAdmin()){toast('רק מנהל ראשי יכול לערוך מנהל ראשי','var(--red)');return}
  sm(`<div class="modal">
    <div class="mhdr"><h2>✏️ עריכת משתמש</h2><button class="mclose" onclick="cm()">✕</button></div>
    <div class="mbody">
      <div class="fg"><label>שם מלא *</label>
        <input class="fc" id="eu-name" value="${u.name}">
      </div>
      <div class="fg"><label>מספר טלפון (זיהוי כניסה) *</label>
        <input class="fc" id="eu-phone" type="tel" value="${u.phone}" inputmode="tel">
      </div>
      <div class="fg"><label>תפקיד / כותרת</label>
        <input class="fc" id="eu-title" value="${u.title||''}">
      </div>
      <div class="fg"><label>הרשאה במערכת *</label>
        <select class="fc" id="eu-role">
          ${isSuperAdmin()?`<option value="superadmin" ${u.role==='superadmin'?'selected':''}>👑 מנהל ראשי</option>`:''}
          <option value="housing" ${u.role==='housing'?'selected':''}>🔧 מנהל דיור</option>
          <option value="manager" ${u.role==='manager'?'selected':''}>🏠 מנהל דירה</option>
        </select>
      </div>
      <div class="fg"><label>אזור / דירות</label>
        <input class="fc" id="eu-zone" value="${u.zone||''}">
      </div>
      <div class="fg"><label>סטטוס</label>
        <select class="fc" id="eu-active">
          <option value="1" ${u.active?'selected':''}>פעיל</option>
          <option value="0" ${!u.active?'selected':''}>מושבת</option>
        </select>
      </div>
      <div class="div"></div>
      <div class="fg"><label>סיבת עדכון *</label>
        <input class="fc" id="eu-reason" placeholder="מה השתנה ולמה...">
      </div>
    </div>
    <div class="mfoot">
      <button class="btn btnp" onclick="submitEditUser('${u.id}')">💾 שמור שינויים</button>
      <button class="btn btno" onclick="cm()">ביטול</button>
    </div>
  </div>`);
}

function submitEditUser(uid){
  const reason=document.getElementById('eu-reason').value.trim();
  if(!reason){toast('סיבת עדכון חובה','var(--red)');return}
  const phone=document.getElementById('eu-phone').value.replace(/[\s\-]/g,'');
  const u=USERS.find(x=>x.id===uid);
  const changes=[];
  if(u.name!==document.getElementById('eu-name').value.trim())changes.push('שם');
  if(u.phone!==phone)changes.push('טלפון');
  if(u.role!==document.getElementById('eu-role').value)changes.push('הרשאה');
  u.name=document.getElementById('eu-name').value.trim();
  u.phone=phone;
  u.title=document.getElementById('eu-title').value.trim();
  u.role=document.getElementById('eu-role').value;
  u.rh={superadmin:'מנהל ראשי',housing:'מנהל דיור',manager:'מנהל דירה'}[u.role];
  u.zone=document.getElementById('eu-zone').value.trim();
  u.active=document.getElementById('eu-active').value==='1';
  LOG.unshift({ts:new Date().toLocaleString('he-IL'),user:CU.name,act:'עדכון משתמש',apt:'—',ch:`${u.name} — ${reason}`});
  cm();go('users');
  toast('המשתמש עודכן ✓','var(--green)');
}
